# Quality gate on every push and pull request: lint, types, unit, integration (real PostgreSQL),
# end-to-end in Chrome against the production build, and a dependency audit.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lemans
          POSTGRES_USER: lemans
          POSTGRES_PASSWORD: ci-only-database-password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U lemans -d lemans" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://lemans:ci-only-database-password@localhost:5434/lemans
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
