# LeMans 2.0 - reverse proxy. Whole site behind a password while it runs in demo mode.
limit_req_zone $binary_remote_addr zone=lemans_login:10m rate=10r/m;

server {
    listen 80;
    server_name lemans.acnhpssingapore.com;

    client_max_body_size 1m;

    # No includeSubDomains: the parent domain is shared with other apps.
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "LeMans 2.0";
    auth_basic_user_file /etc/nginx/lemans.htpasswd;

    location = /api/auth/demo-login {
        limit_req zone=lemans_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3310;
        include /etc/nginx/lemans-proxy.conf;
    }

    # The job trigger is for the host's cron only.
    location ^~ /api/internal/ {
        return 404;
    }

    # Supporting documents (for example a medical certificate) up to 5 MB.
    location ~ ^/api/leave/[0-9]+/attachments$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3310;
        include /etc/nginx/lemans-proxy.conf;
    }

    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3310;
        include /etc/nginx/lemans-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3310;
        include /etc/nginx/lemans-proxy.conf;
    }
}
