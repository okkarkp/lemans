# LeMans 2.0 as a single container: the app and its PostgreSQL database.
# All state lives in the "data" volume (database files and generated secrets).
name: lemans2

services:
  lemans:
    image: lemans2:${LEMANS_VERSION:?set in .env}
    container_name: lemans2
    restart: unless-stopped
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      OFFICE_CIDRS: ${OFFICE_CIDRS:-}
      COVERAGE_FLOOR: ${COVERAGE_FLOOR:-0.8}
      ATTENDANCE_FLOOR: ${ATTENDANCE_FLOOR:-0.85}
      MISSING_CHECKIN_ALERT_TIME: ${MISSING_CHECKIN_ALERT_TIME:-12:00}
      CHECKIN_REMINDER_TIME: ${CHECKIN_REMINDER_TIME:-11:00}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-LeMans 2.0 <no-reply@lemans.invalid>}
      APP_BASE_URL: ${APP_BASE_URL:-https://lemans.acnhpssingapore.com}
    ports:
      - "127.0.0.1:3310:3100"
    volumes:
      - data:/data
    stop_grace_period: 30s
    mem_limit: 1280m
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  data: {}
