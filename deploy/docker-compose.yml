# Production-style deployment on a shared host. Values come from .env next to this file
# (generated on the server, mode 600). Only the app is reachable, and only from localhost.
name: lemans2

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lemans
      POSTGRES_USER: lemans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemans -d lemans"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  app:
    image: lemans2-app:${LEMANS_VERSION:?set in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &appenv
      DATABASE_URL: postgres://lemans:${POSTGRES_PASSWORD}@db:5432/lemans
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      DEMO_MODE: ${DEMO_MODE:-false}
      OFFICE_CIDRS: ${OFFICE_CIDRS:-}
      COVERAGE_FLOOR: ${COVERAGE_FLOOR:-0.8}
      ATTENDANCE_FLOOR: ${ATTENDANCE_FLOOR:-0.85}
      MISSING_CHECKIN_ALERT_TIME: ${MISSING_CHECKIN_ALERT_TIME:-12:00}
    ports:
      - "127.0.0.1:3310:3100"
    networks: [internal]
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]

  tools:
    image: lemans2-tools:${LEMANS_VERSION}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *appenv
    networks: [internal]

networks:
  internal: {}

volumes:
  db-data: {}
