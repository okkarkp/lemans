# Deployment on a shared host. Values come from .env next to this file (generated on the
# server, mode 600). Only the app is reachable, and only from localhost.
name: lemans2

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app-env: &appenv
  SESSION_SECRET: ${SESSION_SECRET:?set in .env}
  DEMO_MODE: ${DEMO_MODE:-false}
  OFFICE_CIDRS: ${OFFICE_CIDRS:-}
  COVERAGE_FLOOR: ${COVERAGE_FLOOR:-0.8}
  ATTENDANCE_FLOOR: ${ATTENDANCE_FLOOR:-0.85}
  MISSING_CHECKIN_ALERT_TIME: ${MISSING_CHECKIN_ALERT_TIME:-12:00}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lemans
      POSTGRES_USER: lemans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemans -d lemans"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *logging

  app:
    image: lemans2-app:${LEMANS_VERSION:?set in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *appenv
      # Least privilege: the app never connects as the schema owner.
      DATABASE_URL: postgres://${APP_DB_USER:-lemans_app}:${APP_DB_PASSWORD:?set in .env}@db:5432/lemans
    ports:
      - "127.0.0.1:3310:3100"
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  tools:
    image: lemans2-tools:${LEMANS_VERSION}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *appenv
      DATABASE_URL: postgres://lemans:${POSTGRES_PASSWORD}@db:5432/lemans
      MIGRATION_DATABASE_URL: postgres://lemans:${POSTGRES_PASSWORD}@db:5432/lemans
      APP_DATABASE_URL: postgres://${APP_DB_USER:-lemans_app}:${APP_DB_PASSWORD}@db:5432/lemans
      APP_DB_USER: ${APP_DB_USER:-lemans_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    networks: [internal]
    logging: *logging

networks:
  internal: {}

volumes:
  db-data: {}
