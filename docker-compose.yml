services:
  db:
    image: postgres:16-alpine
    container_name: lemans2-db
    environment:
      POSTGRES_DB: lemans
      POSTGRES_USER: lemans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - lemans2-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemans -d lemans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lemans2-db:
